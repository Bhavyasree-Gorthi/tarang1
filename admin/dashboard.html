<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Department Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #ff6b00;
            --primary-light: #ff8c33;
            --primary-dark: #cc5500;
            --secondary: #333333;
            --text-light: #ffffff;
            --text-dark: #333333;
            --background: #ffffff;
            --accent: #ff3b00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-form {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: var(--text-light);
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .dashboard {
            display: none;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1;
        }

        .dashboard video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .dashboard .container {
            position: relative;
            z-index: 2;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--primary);
        }

        .dashboard h1 {
            color: var(--secondary);
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .dashboard-card {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .dashboard-card h3 {
            color: var(--secondary);
            margin-bottom: 15px;
        }

        .dashboard-card p {
            color: #666;
        }

        .event-list {
            list-style: none;
        }

        .event-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .dept-badge {
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        #paymentsTable {
            width: 100%;
            border-collapse: collapse;
        }

        #paymentsTable th, #paymentsTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        #paymentsTable th {
            background-color: var(--primary);
            color: white;
        }

        #analyticsChart {
            max-width: 100%;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <form class="login-form" id="loginForm">
            <h2>Admin Login</h2>
            <div class="form-group">
                <input type="email" class="form-control" id="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
    </div>

    <div class="dashboard" id="dashboard">
        <video autoplay muted loop>
            <source src="https://sample-videos.com/zip/10/mp4/SampleVideo_1280x720_1mb.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="container">
            <div class="dashboard-header">
                <h1>Civil Department Admin Dashboard - <span id="deptTitle">Civil</span></h1>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3><i class="fas fa-calendar-alt"></i> Events Management</h3>
                    <p>Manage upcoming events, registrations, and schedules.</p>
                    <ul class="event-list" id="eventsList">
                        <!-- Events will be loaded here -->
                    </ul>
                </div>

                <div class="dashboard-card">
                    <h3><i class="fas fa-users"></i> Registrations</h3>
                    <p>View and manage event registrations.</p>
                    <p id="registrationsCount">Total Registrations: Loading...</p>
                </div>

                <div class="dashboard-card">
                    <h3><i class="fas fa-table"></i> Payment Details</h3>
                    <table id="paymentsTable">
                        <thead><tr><th>Name</th><th>Event</th><th>UTR</th><th>Screenshot</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <div class="dashboard-card">
                    <h3><i class="fas fa-chart-pie"></i> Analytics</h3>
                    <canvas id="analyticsChart"></canvas>
                </div>

                <div class="dashboard-card">
                    <h3><i class="fas fa-download"></i> Export</h3>
                    <button onclick="exportCSV()">Export Registrations to CSV</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://mmbrwywesmbwsczuqiha.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1tYnJ3eXdlc21id3NjenVxaWhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkwNTUyNzEsImV4cCI6MjA3NDYzMTI3MX0.yW5NNNKUbR6X_OCj3xBlH50B2svp3f_B58-nR0NIKHs'; // Replace with your actual anon/public key from Supabase Settings > API
        const supabase = createClient(supabaseUrl, supabaseKey);

        const allowedEmails = ['deptcivil@srit.ac.in', 'eventadmin@srit.ac.in', 'principal@srit.ac.in'];
        const password = '123456';
        let userDept = 'Civil'; // Default

        const loginForm = document.getElementById('loginForm');
        const loginContainer = document.getElementById('loginContainer');
        const dashboard = document.getElementById('dashboard');
        const logoutBtn = document.getElementById('logoutBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if (!allowedEmails.includes(email)) {
                alert('Email not authorized for admin access.');
                return;
            }

            try {
                // Use Supabase Auth for login
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: pass,
                });

                if (error) throw error;

                // Fetch user department
                const { data: userProfile } = await supabase
                    .from('users')
                    .select('department, role')
                    .eq('email', data.user.email)
                    .single();
                userDept = userProfile?.department || 'Civil';
                if (data.user.email === 'principal@srit.ac.in') {
                    userDept = 'all';
                }
                if (userProfile?.role !== 'head' && data.user.email !== 'principal@srit.ac.in') {
                    alert('Access denied. Must be department head.');
                    return;
                }

                // Check if user is logged in and email matches allowed
                if (data.user && allowedEmails.includes(data.user.email)) {
                    document.getElementById('deptTitle').textContent = userDept === 'all' ? 'All' : userDept;
                    loginContainer.style.display = 'none';
                    dashboard.style.display = 'block';
                    loadDashboardData();
                } else {
                    alert('Invalid credentials or unauthorized email.');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed. Please check your credentials.');
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            dashboard.style.display = 'none';
            loginContainer.style.display = 'flex';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
        });

        async function loadDashboardData() {
            try {
                // Ensure user is authenticated
                const { data: { user } } = await supabase.auth.getUser();
                if (!user || !allowedEmails.includes(user.email)) {
                    alert('Access denied. Please log in as an admin.');
                    logoutBtn.click();
                    return;
                }

                // Load events from Supabase (filtered by department)
                const { data: events, error } = await supabase
                    .from('events')
                    .select('*')
                    .eq('department', userDept)
                    .order('date', { ascending: true });

                if (error) throw error;

                const eventsList = document.getElementById('eventsList');
                eventsList.innerHTML = '';
                if (events && events.length > 0) {
                    events.forEach(event => {
                        const li = document.createElement('li');
                        li.className = 'event-item';
                        li.innerHTML = `<strong>${event.title || 'Untitled'}</strong> - ${event.date || 'No date'} <span class="dept-badge">${event.department}</span>`;
                        eventsList.appendChild(li);
                    });
                } else {
                    eventsList.innerHTML = '<li class="event-item">No events found.</li>';
                }

                // Load registrations count (filtered)
                const { count, error: countError } = await supabase
                    .from('registrations')
                    .select('*', { count: 'exact', head: true })
                    .eq('department', userDept);

                if (countError) throw countError;

                document.getElementById('registrationsCount').textContent = `Total Registrations: ${count || 0}`;

                // Load payment details table
                const { data: regs } = await supabase
                    .from('registrations')
                    .select('*')
                    .eq('department', userDept);

                const paymentsTable = document.getElementById('paymentsTable').querySelector('tbody');
                paymentsTable.innerHTML = '';
                if (regs && regs.length > 0) {
                    regs.forEach(reg => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${reg.full_name || 'N/A'}</td>
                            <td>${reg.event || 'N/A'}</td>
                            <td>${reg.utr_number || 'N/A'}</td>
                            <td>${reg.payment_screenshot_url ? `<a href="${reg.payment_screenshot_url}" target="_blank">View</a>` : 'N/A'}</td>
                            <td>${reg.payment_status || 'pending'}</td>
                            <td><button onclick="updateStatus('${reg.id}', 'approved')">Approve</button> <button onclick="updateStatus('${reg.id}', 'rejected')">Reject</button></td>
                        `;
                        paymentsTable.appendChild(row);
                    });
                } else {
                    paymentsTable.innerHTML = '<tr><td colspan="6">No payments found.</td></tr>';
                }

                // Load analytics chart (if events exist)
                if (events && events.length > 0) {
                    const eventLabels = events.map(e => e.title);
                    const regCounts = await Promise.all(events.map(async (e) => {
                        const { count } = await supabase.from('registrations').select('*', { count: 'exact', head: true }).eq('event', e.title).eq('department', userDept);
                        return count || 0;
                    }));
                    const ctx = document.getElementById('analyticsChart').getContext('2d');
                    if (window.analyticsChart) {
                        window.analyticsChart.destroy();
                    }
                    window.analyticsChart = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: eventLabels,
                            datasets: [{
                                data: regCounts,
                                backgroundColor: ['#ff6b00', '#ff8c33', '#cc5500', '#ff3b00']
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                // Fallback to static data if Supabase not set up
                document.getElementById('eventsList').innerHTML = '<li class="event-item">Paper Presentation - Apr 3 <span class="dept-badge">Civil</span></li><li class="event-item">Bridge Blitz - Apr 3 <span class="dept-badge">Civil</span></li>';
                document.getElementById('registrationsCount').textContent = 'Total Registrations: 150';
            }
        }

        async function updateStatus(id, status) {
            try {
                const { error } = await supabase.from('registrations').update({ payment_status: status }).eq('id', id);
                if (error) throw error;
                loadDashboardData(); // Refresh
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Failed to update status.');
            }
        }

        async function exportCSV() {
            try {
                const { data } = await supabase.from('registrations').select('*').eq('department', userDept);
                if (data && data.length > 0) {
                    const csv = Papa.unparse(data);
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${userDept}-registrations.csv`;
                    a.click();
                    URL.revokeObjectURL(url);
                } else {
                    alert('No data to export.');
                }
            } catch (error) {
                console.error('Error exporting CSV:', error);
                alert('Failed to export CSV.');
            }
        }

        // Listen for auth changes
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT') {
                dashboard.style.display = 'none';
                loginContainer.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
